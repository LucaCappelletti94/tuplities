name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: ${{ matrix.rust }}
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-${{ matrix.rust }}-default-${{ hashFiles('**/Cargo.lock') }}
    - name: Run tests
      run: cargo test -p tuplities --verbose
    - name: Run tests (release)
      run: cargo test -p tuplities --release --verbose

  fmt:
    name: Rustfmt
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: stable
        components: rustfmt
    - name: Check formatting
      run: cargo fmt -p tuplities -- --check

  clippy:
    name: Clippy
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: stable
        components: clippy
    - name: Run clippy
      run: cargo clippy -p tuplities --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: stable
    - name: Check documentation
      run: cargo doc -p tuplities --no-deps --all-features --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.85.0
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: 1.85.0
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-msrv-1.85.0-all-and-core-${{ hashFiles('**/Cargo.lock') }}
    - name: Run tests
      run: cargo test -p tuplities --all-features
    - name: Run tests (no default features)
      run: cargo test -p tuplities --no-default-features

  embedded:
    name: no_std thumbv7em-none-eabi
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: 1.85.0
        targets: thumbv7em-none-eabi
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-embedded-1.85.0-thumbv7em-none-eabi-core-${{ hashFiles('**/Cargo.lock') }}
    - name: Check embedded target
      run: cargo check -p tuplities --target thumbv7em-none-eabi --no-default-features

  feature-configuration:
    name: Feature configuration
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      features: ${{ steps.discover.outputs.features }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Discover supported feature configurations
      id: discover
      run: |
        python3 - <<'PY'
        import json
        import os
        import tomllib

        with open("tuplities/Cargo.toml", "rb") as manifest:
            features = tomllib.load(manifest)["features"]

        sizes = sorted(
            (name for name in features if name.startswith("size-") and name[5:].isdigit()),
            key=lambda name: int(name[5:]),
        )
        configurations = [
            "--no-default-features --features alloc",
            "--no-default-features --features flatten-nest",
        ]
        configurations += [
            f"--no-default-features --features flatten-nest,{size}" for size in sizes
        ]
        if len(sizes) >= 2:
            configurations.append(
                f"--no-default-features --features flatten-nest,{sizes[0]},{sizes[1]}"
            )

        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"features={json.dumps(configurations)}")
        PY

  features:
    name: Features ${{ matrix.features }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: feature-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        features: ${{ fromJSON(needs.feature-configuration.outputs.features) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: stable
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-features-stable-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
    - name: Run tests
      env:
        FEATURE_ARGS: ${{ matrix.features }}
      run: |
        read -r -a features <<< "$FEATURE_ARGS"
        nice -n 10 cargo test -p tuplities "${features[@]}"

  coverage:
    name: Code Coverage
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: nightly
        components: llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
      with:
        tool: cargo-llvm-cov
        fallback: none
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-coverage-nightly-all-${{ hashFiles('**/Cargo.lock') }}
    - name: Generate coverage
      run: |
        cargo llvm-cov -p tuplities --all-targets --all-features --no-report
        cargo llvm-cov -p tuplities --doc --all-features --no-clean --lcov --output-path target/coverage.lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/coverage.lcov
        fail_ci_if_error: false

  mutants:
    name: Mutation testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: stable
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-mutants
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
      with:
        tool: cargo-mutants@27.1.0
        fallback: none
    - name: Run bounded mutation testing
      run: |
        status=0
        nice -n 10 cargo mutants -p tuplities --jobs 2 --jobserver-tasks 2 --all-features \
          --output "$RUNNER_TEMP/mutation-results" || status=$?
        python3 -B tools/check_mutants.py \
          "$RUNNER_TEMP/mutation-results/mutants.out/outcomes.json" --exit-code "$status"
    - name: Upload mutation reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mutation-reports
        path: ${{ runner.temp }}/mutation-results/mutants.out/
