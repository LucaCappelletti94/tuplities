name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - run: cargo test -p tuplities --locked
      - run: cargo test -p tuplities --all-features --locked

  quality:
    name: Formatting, linting, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -p tuplities -- --check
      - run: cargo clippy -p tuplities --all-targets --all-features --locked -- -D warnings
      - run: cargo doc -p tuplities --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV and no_std
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.85.0
          targets: thumbv7em-none-eabi
      - run: cargo check -p tuplities --lib --all-features --locked
      - run: cargo check -p tuplities --lib --no-default-features --locked
      - run: cargo check -p tuplities --lib --no-default-features --target thumbv7em-none-eabi --locked

  features:
    name: Features (${{ matrix.features || 'core' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        features:
          - ""
          - alloc
          - flatten-nest
          - flatten-nest,size-16
          - flatten-nest,size-32
          - flatten-nest,size-48
          - flatten-nest,size-64
          - flatten-nest,size-96
          - flatten-nest,size-128
          - flatten-nest,size-16,size-32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - run: cargo test -p tuplities --no-default-features --features "$FEATURES" --locked
        env:
          FEATURES: ${{ matrix.features }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: cargo-llvm-cov
          fallback: none
      - run: cargo llvm-cov -p tuplities --all-targets --all-features --locked --no-report
      - run: cargo llvm-cov -p tuplities --doc --all-features --locked --no-clean --lcov --output-path target/coverage.lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage.lcov
          fail_ci_if_error: false
