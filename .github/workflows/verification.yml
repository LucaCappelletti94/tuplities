name: Package Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

permissions:
  contents: read

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: stable
    - name: Install Rust 1.85.0
      run: rustup toolchain install 1.85.0
    - name: Verify checkout compilation workloads
      run: tools/verify_compile_workloads.sh
    - name: Verify package contract
      run: tools/verify_package.sh
    - name: Upload verification artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verification
        path: |
          target/verification/
          !target/verification/**/target/**
    - name: Upload package archive
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: package-archive
        path: target/package/*.crate
