name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install cargo-audit
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
      with:
        tool: cargo-audit
        fallback: none
    - run: cargo audit
